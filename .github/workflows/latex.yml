name: Build LaTeX report

on:
  push:
    branches: [latex-report]
    paths:
      - "latex/**"
      - "src/**"
      - ".github/workflows/latex.yml"
  pull_request:
    branches: [latex-report]
    paths:
      - "latex/**"
      - "src/**"
      - ".github/workflows/latex.yml"

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install TeX Live, Biber, and Unicode fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-xetex \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-bibtex-extra \
            fonts-dejavu-core \
            biber

      - name: Build report and bibliography
        working-directory: latex
        run: make

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: dry-srp-research-report
          path: latex/report.pdf
          if-no-files-found: error
